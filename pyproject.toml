[project]
name = "chuhaijian-codeaudit"
version = "0.2.0"
description = "出海鉴 · 源码只读审计 / 组件缓存 / 锁文件依赖提取"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.scripts]
codeaudit = "codeaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
